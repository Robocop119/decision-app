<!DOCTYPE html>
<html lang="en">

<head>
    <title>Decision App</title>

    <h2>Your decisions</h2>

    <ul>
        {% for decision in decisions %}
        <li>
            <a href="/decision/{{ decision[0] }}">
                {{ decision[1] }}
            </a>
        </li>
        {% endfor %}
    </ul>
</head>

<body>
    <h1>Decision App</h1>
    <p>Welcome to the Decision App!</p>

    <a href="/create">Create a decision</a>
</body>

</html>
